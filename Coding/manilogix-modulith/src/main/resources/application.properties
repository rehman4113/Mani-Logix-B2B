spring.application.name=manilogix
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/manilogix}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt-secret=${JWT_SECRET}
security.bootstrap-admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

