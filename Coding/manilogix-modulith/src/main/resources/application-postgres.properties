# PostgreSQL deployment profile for the dedicated ManiLogix Neon database; MySQL remains the default profile.
# DB_URL must be a JDBC URL with SSL and a direct Neon host while Flyway runs at startup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-init-sql=SET search_path TO manilogix,public
spring.jpa.properties.hibernate.default_schema=manilogix
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/postgresql
spring.flyway.schemas=manilogix
spring.flyway.default-schema=manilogix
spring.flyway.create-schemas=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
# On demand Vercel containers may serve a first request before ApplicationReadyEvent.
# Readiness reports the required database dependency directly.
management.endpoint.health.group.readiness.include=db
