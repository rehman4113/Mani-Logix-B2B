# Dedicated Supabase PostgreSQL deployment profile; MySQL remains the default profile.
# DB_URL must be a JDBC URL with SSL and a network-reachable Supavisor host.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-init-sql=SET search_path TO manilogix,public
spring.jpa.properties.hibernate.default_schema=manilogix
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/postgresql
spring.flyway.schemas=manilogix
spring.flyway.default-schema=manilogix
spring.flyway.create-schemas=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
