name: Temporary PostgreSQL deployment check
on:
  push:
    branches: [vercel-supabase-backend]
    paths:
      - 'Coding/manilogix-modulith/**'
      - '.github/workflows/manilogix-postgres-check.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-password
          POSTGRES_DB: manilogix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d manilogix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://localhost:5432/manilogix_test
      DB_USERNAME: postgres
      DB_PASSWORD: integration-password
      JWT_SECRET: temporary-integration-jwt-secret-at-least-32-bytes
      BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      BOOTSTRAP_ADMIN_PASSWORD: temporary-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Coding/manilogix-modulith/pom.xml
      - name: Run PostgreSQL order integration test
        working-directory: Coding/manilogix-modulith
        run: mvn -B -Dtest=OrderFlowIntegrationTest test
