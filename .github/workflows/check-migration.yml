name: Verify MySQL Migration
on:
  push:
    branches: [mysql-mongo-migration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testsecret
          MYSQL_DATABASE: manilogix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestsecret"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/manilogix
      DB_USERNAME: root
      DB_PASSWORD: testsecret
      JWT_SECRET: migration-test-secret-at-least-thirty-two-bytes
      BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      BOOTSTRAP_ADMIN_PASSWORD: temporary-admin-password
      DB_TEST_ADMIN_URL: mysql://root:testsecret@127.0.0.1:3306/manilogix
      TEST_MYSQL_URL: mysql://root:testsecret@127.0.0.1:3306/manilogix_import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Coding/manilogix-modulith/pom.xml
      - name: Spring and MySQL integration tests
        run: mvn -B -f Coding/manilogix-modulith/pom.xml test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r Coding/manilogix-modulith/migration/requirements.txt
      - name: Import preflight and MySQL transactional smoke test
        run: python -m unittest discover -s Coding/manilogix-modulith/migration/tests -v
